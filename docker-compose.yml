services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: posgourmet_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-posgourmet}
      DB_USERNAME: ${DB_USERNAME:-posgourmet}
      DB_PASSWORD: ${DB_PASSWORD:-posgourmet}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: posgourmet_web
    restart: unless-stopped
    ports:
      - "8600:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: postgres:17-alpine
    container_name: posgourmet_db
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-posgourmet}
      POSTGRES_USER: ${DB_USERNAME:-posgourmet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-posgourmet}
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MySQL con la base del sistema original, sólo para migrar los datos:
  #   docker compose --profile legacy up -d legacy-db   (carga los .sql de docker/legacy/)
  #   docker compose exec app php artisan legacy:importar
  legacy-db:
    image: mysql:8.0
    container_name: posgourmet_legacy_db
    profiles: ["legacy"]
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: ${LEGACY_DB_PASSWORD:-root}
      MYSQL_DATABASE: ${LEGACY_DB_DATABASE:-posgourmet}
    volumes:
      - ./docker/legacy:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
